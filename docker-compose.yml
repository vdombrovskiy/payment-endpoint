services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_endpoint
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payment_endpoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: dev-only-change-me
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/payment_endpoint
      TEST_DATABASE_URL: postgresql+psycopg://app:app@db:5432/payment_endpoint_test
      FLASK_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
